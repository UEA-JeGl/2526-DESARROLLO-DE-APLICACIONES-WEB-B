<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% block title %}
        TecnoSoluciones
        {% endblock %}
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS propio -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/estilos.css') }}">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow sticky-top">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="{{ url_for('inicio') }}">

                TecnoSoluciones

            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div
                class="collapse navbar-collapse"
                id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{{ url_for('inicio') }}">

                            Inicio

                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{{ url_for('productos') }}">

                            Productos

                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{{ url_for('clientes') }}">

                            Clientes

                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{{ url_for('proveedores') }}">

                            Proveedores

                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{{ url_for('facturacion') }}">

                            Facturación

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- CONTENIDO DE CADA PÁGINA -->

    <main>

        {% block content %}

        {% endblock %}

    </main>


    <!-- FOOTER -->

    <footer class="bg-dark text-white text-center p-4 mt-5">

        <div class="container">

            <h5>
                TecnoSoluciones
            </h5>

            <p>
                Proyecto Integrador - Desarrollo de Aplicaciones Web
            </p>

            <p>
                Estudiante: Johanna Gamboa Luna
            </p>

            <p class="mb-0">
                © 2026 Todos los derechos reservados.
            </p>

        </div>

    </footer>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- JavaScript propio -->

    <script
        src="{{ url_for('static', filename='js/script.js') }}">
    </script>

</body>

</html>
